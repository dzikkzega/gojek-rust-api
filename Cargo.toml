[package]
name = "gojek-rust-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
axum = "0.8.9"
jsonwebtoken = "9.3.0"
rand = "0.8.5"
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.8"
subtle = "2.6.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "migrate", "uuid"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
