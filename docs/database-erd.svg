<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080" role="img" aria-labelledby="title desc">
<title id="title">GOJEK Rust API — database ERD</title>
<desc id="desc">Entity relationship diagram for the ride-hailing MVP PostgreSQL and PostGIS schema. Includes users, driver onboarding, fares, quotes, trips, events, payments, ratings and audit.</desc>
<defs>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#183044}.title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#526574}.group{font-size:14px;font-weight:700;letter-spacing:.5px}.box{fill:#fff;stroke:#7890a0;stroke-width:1.4;rx:9}.hd1{fill:#dceef4}.hd2{fill:#e7e4f7}.hd3{fill:#e2f1e7}.hd4{fill:#fff0d8}.hd5{fill:#f5e5e9}.name{font-size:14px;font-weight:700}.f{font-size:11px}.pk{font-size:11px;font-weight:700;fill:#145c79}.fk{font-size:11px;font-weight:600;fill:#8a4b08}.hint{font-size:10px;fill:#526574}.edge{stroke:#526b7a;stroke-width:1.5;fill:none}.lab{font-size:10px;fill:#405868;paint-order:stroke;stroke:#f7f9fb;stroke-width:4px;stroke-linejoin:round}.legend{font-size:11px;fill:#334b5b}
</style>
<marker id="one" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#526b7a" stroke-width="1.4"/></marker>
<marker id="many" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><path d="M1 1L6 6L1 11M6 6L11 1M6 6L11 11" fill="none" stroke="#526b7a" stroke-width="1.4"/></marker>
<marker id="opt" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto"><circle cx="3" cy="6" r="2.2" fill="#fff" stroke="#526b7a" stroke-width="1.3"/><path d="M7 1L11 6L7 11" fill="none" stroke="#526b7a" stroke-width="1.3"/></marker>
</defs>
<rect width="1840" height="1080" fill="#f7f9fb"/>
<text class="title" x="36" y="42">Database ERD — Ride-hailing MVP</text>
<text class="sub" x="36" y="66">PostgreSQL + PostGIS · relational keys follow migrations/20261025000200_initial_schema.sql · driver live locations stay in Redis</text>

<!-- domain panels -->
<rect x="24" y="92" width="590" height="900" rx="14" fill="#eff7fa" stroke="#c8dfe8"/><text class="group" x="42" y="117">ACCOUNT &amp; DRIVER ONBOARDING</text>
<rect x="630" y="92" width="520" height="900" rx="14" fill="#f0f7f1" stroke="#cfe3d1"/><text class="group" x="648" y="117">SERVICE, FARE &amp; QUOTE</text>
<rect x="1166" y="92" width="300" height="900" rx="14" fill="#fff8eb" stroke="#ecdcb9"/><text class="group" x="1184" y="117">TRIP LIFECYCLE</text>
<rect x="1482" y="92" width="334" height="900" rx="14" fill="#f8f1f3" stroke="#e6cfd6"/><text class="group" x="1500" y="117">TRIP RECORDS</text>

<!-- connectors: relationship lines behind cards -->
<g class="edge">
 <path d="M260 190H320" marker-start="url(#one)" marker-end="url(#many)"/>
 <path d="M260 260H285V390H320" marker-start="url(#one)" marker-end="url(#zeroone)"/>
