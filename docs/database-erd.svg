<rect x="340" y="1035" width="14" height="14" rx="3" fill="#fff0d8" stroke="#7890a0"/><text class="legend" x="361" y="1047">Trip</text>
<rect x="410" y="1035" width="14" height="14" rx="3" fill="#f5e5e9" stroke="#7890a0"/><text class="legend" x="431" y="1047">Records</text>
<path d="M520 1042H575" class="edge" marker-start="url(#one)" marker-end="url(#many)"/><text class="legend" x="585" y="1047">one-to-many</text>
<path d="M690 1042H745" class="edge" marker-start="url(#opt)" marker-end="url(#many)"/><text class="legend" x="755" y="1047">optional relation</text>
<text class="hint" x="40" y="1070">PK primary key · FK foreign key · UQ unique · Money uses minor units · Diagram shows relationships, not stored data</text>
</svg>
